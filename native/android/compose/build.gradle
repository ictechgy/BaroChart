plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 버전 단일 원천은 저장소 루트 package.json이다
def sharedVersion = new groovy.json.JsonSlurper().parse(file('../../../package.json')).version
group = 'kr.coden'
version = providers.gradleProperty('asterVersion').orElse(sharedVersion).get()
if (providers.gradleProperty('asterBuildDir').isPresent()) layout.buildDirectory = file(providers.gradleProperty('asterBuildDir').get() + '-compose')

android {
    namespace 'kr.coden.barochart.compose'
    compileSdk 36
    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

kotlin {
    // 표준 라이브러리 의존성도 2.2대로 고정해 소비자 앱의 Kotlin·lint 호환 범위를 넓힌다
    coreLibrariesVersion = '2.2.21'
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // 소비자 앱이 오래된 Kotlin·AGP lint(Kotlin 2.2 분석기)로도 읽을 수 있게 메타데이터 버전을 낮춘다
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        allWarningsAsErrors = true
    }
}

dependencies {
    // 코어 SDK(루트 프로젝트). 소비자는 이 모듈만 추가해도 코어를 함께 받는다.
    api project(':')
    // BOM 2026.06.01 = Compose 1.11.4: compileSdk 35+·AGP 8.6+를 요구한다(2026.08.00부터는 compileSdk 37 필요).
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
