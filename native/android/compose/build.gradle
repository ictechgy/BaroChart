plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'maven-publish'
    id 'signing'
}

// 버전 단일 원천은 저장소 루트 package.json이다
def sharedVersion = new groovy.json.JsonSlurper().parse(file('../../../package.json')).version
group = 'kr.coden'
version = providers.gradleProperty('asterVersion').orElse(sharedVersion).get()
if (providers.gradleProperty('asterBuildDir').isPresent()) layout.buildDirectory = file(providers.gradleProperty('asterBuildDir').get() + '-compose')

android {
    namespace 'kr.coden.barochart.compose'
    compileSdk 36
    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

kotlin {
    // 표준 라이브러리 의존성도 2.2대로 고정해 소비자 앱의 Kotlin·lint 호환 범위를 넓힌다
    coreLibrariesVersion = '2.2.21'
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // 소비자 앱이 오래된 Kotlin·AGP lint(Kotlin 2.2 분석기)로도 읽을 수 있게 메타데이터 버전을 낮춘다
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        allWarningsAsErrors = true
    }
}

dependencies {
    // 코어 SDK(루트 프로젝트). 소비자는 이 모듈만 추가해도 코어를 함께 받는다.
    api project(':')
    // BOM 2026.06.01 = Compose 1.11.4: compileSdk 35+·AGP 8.6+를 요구한다(2026.08.00부터는 compileSdk 37 필요).
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Maven 게시: 로컬 리허설은 -PbarochartLocalRepo=<경로>로 file 저장소에 올린다.
// Central 업로드·서명은 저장소 주인이 승인한 뒤 signing.* 속성을 주입해 실행한다(키는 저장소에 두지 않는다).
android {
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'kr.coden'
                artifactId = 'barochart-compose'
                version = project.version
                pom {
                    name = 'barochart-compose'
                    description = 'Jetpack Compose wrapper for the BaroChart Android SDK.'
                    url = 'https://github.com/ictechgy/BaroChart'
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'ictechgy'
                            name = 'BaroChart contributors'
                            url = 'https://github.com/ictechgy'
                        }
                    }
                    scm {
                        url = 'https://github.com/ictechgy/BaroChart'
                        connection = 'scm:git:https://github.com/ictechgy/BaroChart.git'
                        developerConnection = 'scm:git:ssh://git@github.com/ictechgy/BaroChart.git'
                    }
                }
            }
        }
        repositories {
            if (providers.gradleProperty('barochartLocalRepo').isPresent()) {
                maven {
                    name = 'local'
                    url = uri(providers.gradleProperty('barochartLocalRepo').get())
                }
            }
        }
    }
    // signing.keyId가 주입될 때만 서명한다(로컬 리허설·CI 빌드는 서명하지 않음)
    if (project.hasProperty('signing.keyId')) {
        signing { sign publishing.publications.release }
    }
}
