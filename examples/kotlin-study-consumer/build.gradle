plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
}
if (providers.gradleProperty('consumerBuildRoot').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('consumerBuildRoot').get() + '/root')
}
subprojects {
    if (providers.gradleProperty('consumerBuildRoot').isPresent()) {
        layout.buildDirectory = file(providers.gradleProperty('consumerBuildRoot').get() + '/' + project.name)
    }
}
