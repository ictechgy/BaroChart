plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 저장소 안에서는 package.json 버전, 저장소 밖 리허설에서는 -PbarochartVersion을 쓴다
def sdkVersion = providers.gradleProperty('barochartVersion').orElse(providers.provider { new groovy.json.JsonSlurper().parse(file('../../../package.json')).version }).get()
if (providers.gradleProperty('sampleBuildRoot').isPresent()) layout.buildDirectory = file(providers.gradleProperty('sampleBuildRoot').get() + '/app')

android {
    namespace 'kr.coden.barochart.sample'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.coden.barochart.sample'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            // 소비자 앱처럼 R8을 켜서 SDK의 consumer rules가 JNI·콜백을 지키는지 확인한다
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

kotlin {
    // SDK와 같은 표준 라이브러리 버전(AGP 8.13 lint의 Kotlin 2.2 분석기와 호환)
    coreLibrariesVersion = '2.2.21'
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        allWarningsAsErrors = true
    }
}

dependencies {
    implementation "kr.coden:barochart-compose:$sdkVersion"
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
