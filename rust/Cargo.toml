# BaroChart 네이티브 Rust 코어 워크스페이스.
# 설계: docs/superpowers/specs/2026-11-02-rust-core-design.md §7
# cargo는 이 Mac의 Homebrew rustc를 피하려고 항상 `node scripts/rust/cargo.mjs <인자>`로 부른다.
[workspace]
resolver = "3"
# crates/*는 출하 크레이트, tools/*는 개발 전용 도구(대조 하네스 등)다.
# tools/*에 크레이트가 없어도 워크스페이스가 열리도록 tools/README.md를 둔다(rust/tools/README.md 참고).
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# 출하 프로필. 크기를 먼저 보고(opt-level "s"), M1에서 "s"와 "3"의 크기·속도를 함께 잰다.
# panic은 unwind로 둔다. FFI 경계의 catch_unwind가 패닉을 잡아 엔진을 poison해야 하기 때문이다.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
opt-level = "s"
