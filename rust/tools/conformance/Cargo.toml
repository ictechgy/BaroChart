[package]
name = "bc-conformance"
description = "개발 전용: barochart-js 커널을 V8·JSC·QuickJS 결과와 대조하는 JSONL 계산기(scripts/rust/conformance.mjs가 부른다)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 커널만 쓴다. 작업 줄도 커널의 JSON 파서로 읽는다(serde를 쓰지 않는다, 설계 §7.2·M1 계획 Global Constraints).
# 출하 산출물(XCFramework, Android .so)에는 들어가지 않는다.
[dependencies]
barochart-js = { path = "../../crates/barochart-js" }
