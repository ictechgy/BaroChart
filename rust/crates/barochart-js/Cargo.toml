[package]
name = "barochart-js"
description = "BaroChart Rust 코어의 JS 의미 커널: Number 포맷, Math, WTF-16 문자열, 순서 보존 JSON, 날짜"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 런타임 의존성은 워크스페이스 전체에서 ryu-js(=1.0.3)뿐이다(M1 계획 Global Constraints).
# Number::toString의 최단 자릿수를 V8과 같게 내려고 쓰며, 버전을 고정한다(설계 §6.4).
[dependencies]
ryu-js = "=1.0.3"
