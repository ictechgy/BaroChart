name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Official release: https://github.com/actions/checkout/releases/tag/v7.0.1
        # ubuntu-latest supplies the runner required by the v7 Node 24 action runtime.

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # Official release: https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: 22

      - name: Install verification TypeScript in runner temp
        shell: bash
        run: |
          set -euo pipefail
          typescript_dir="${RUNNER_TEMP}/barochart-typescript-5.9.3"
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            --prefix "${typescript_dir}" typescript@5.9.3
          echo "TSC_PATH=${typescript_dir}/node_modules/typescript/lib/tsc.js" >> "${GITHUB_ENV}"

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript modules
        run: npm run check

      - name: Check TypeScript declarations
        run: npm run check:types

      - name: Verify offline npm package
        run: npm run check:package

      - name: Run customization studio in Chrome CDP
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest provides Google Chrome; fail explicitly if the image changes
          # so a missing browser is visible as environment drift rather than a skipped check.
          chrome_bin="$(command -v google-chrome || true)"
          if [[ -z "${chrome_bin}" ]]; then
            echo 'google-chrome is required for the customization browser check' >&2
            exit 1
          fi
          CHROME_BIN="${chrome_bin}" npm run test:customization:browser

      - name: Run indicator layout regression in Chrome CDP
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || true)"
          if [[ -z "${chrome_bin}" ]]; then
            echo 'google-chrome is required for the indicator layout browser check' >&2
            exit 1
          fi
          CHROME_BIN="${chrome_bin}" npm run test:indicator-layout:browser

  rust:
    # Rust 네이티브 코어 워크스페이스: 포맷, clippy 경고 0, 테스트, 이식 코드 금지 패턴, JS 의미 커널의 V8·QuickJS 대조
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        # rust/에서 인자 없이 부르면 rustup이 rust-toolchain.toml의 채널·구성요소·타깃을 설치한다(러너 기본 stable과 무관).
        # cargo 래퍼가 cargo를 못 찾을 때 원인을 바로 볼 수 있게 CARGO_HOME과 rustup 위치를 남긴다.
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_HOME=${CARGO_HOME:-unset}"
          command -v rustup cargo || true
          rustup --version
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Check Rust formatting
        run: node scripts/rust/cargo.mjs fmt --check

      - name: Install pinned cbindgen in the repository tool directory
        # 인증 환경을 상속하지 않는 새 rust/.tools Cargo 홈에 0.29.4를 설치하고,
        # 후속 헤더/C smoke는 그 소스로 오프라인 실행한다.
        run: node scripts/rust/install-cbindgen.mjs

      - name: Check generated C ABI header
        run: node scripts/rust/check-header.mjs

      - name: Compile, link, and call the C ABI smoke program
        run: node scripts/rust/c-smoke.mjs

      - name: Clippy with warnings as errors
        # --locked: 커밋한 Cargo.lock과 다른 의존성으로 조용히 빌드하지 않는다
        run: node scripts/rust/cargo.mjs clippy --locked --workspace --all-targets -- -D warnings

      - name: Test the Rust workspace
        run: node scripts/rust/cargo.mjs test --locked --workspace

      - name: Check banned patterns in ported Rust code
        run: node scripts/rust/check-bans.mjs

      - name: Run the real WASM harness without toolchain skips
        env:
          REQUIRE_WASM: '1'
        run: node --test test/rust-wasm-harness.test.mjs

      - name: Compare the JS kernel with V8 and bundled QuickJS on a seeded corpus
        # 같은 시드 고정 코퍼스의 ECMA(r)·Android 방언(q)을 Node(V8)·동봉 QuickJS와 각각 비교한다.
        run: node scripts/rust/conformance.mjs --count 100000 --engines v8,quickjs

  ios-build:
    # 네이티브 SDK(Swift): 경고 0 빌드, macOS JavaScriptCore 테스트, iOS 시뮬레이터 빌드
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pinned native Rust toolchain and locked dependency sources
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          cd ..
          node scripts/rust/cargo.mjs fetch --locked

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Swift build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Swift tests on macOS JavaScriptCore
        run: swift test

      - name: iOS simulator build with warnings as errors
        run: xcodebuild -scheme BaroChart -destination 'generic/platform=iOS Simulator' -derivedDataPath "${RUNNER_TEMP}/dd" build OTHER_SWIFT_FLAGS=-warnings-as-errors

      - name: Build the local Rust XCFramework
        run: node scripts/rust/build-xcframework.mjs

      - name: Swift Rust-enabled tests and release build
        env:
          BAROCHART_RUST_XCFRAMEWORK: ${{ github.workspace }}/artifacts/rust/BaroChartCoreRust.xcframework
        run: |
          swift test --scratch-path "${RUNNER_TEMP}/swift-rust"
          swift build --scratch-path "${RUNNER_TEMP}/swift-rust" -c release -Xswiftc -warnings-as-errors
          xcodebuild -scheme BaroChart -destination 'generic/platform=iOS Simulator' -derivedDataPath "${RUNNER_TEMP}/dd-rust" build OTHER_SWIFT_FLAGS=-warnings-as-errors

  android-build:
    # 네이티브 SDK(Android): 두 ABI AAR, Compose 모듈, 16 KiB 정렬, R8 소비자 앱 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned native Rust toolchain and locked dependency sources
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          cd ..
          node scripts/rust/cargo.mjs fetch --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        # Official release: https://github.com/actions/setup-java/releases/tag/v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        # Official release: https://github.com/gradle/actions/releases/tag/v6.4.1
        with:
          gradle-version: '8.14.5'

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # yes를 파이프로 넘기면 sdkmanager가 끝난 뒤 yes가 SIGPIPE로 실패해 pipefail이 단계를 실패시킨다
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14033849" "cmake;3.22.1" < <(yes) > /dev/null

      - name: Build SDK and Compose AARs
        run: gradle --console=plain -p native/android/library assembleRelease :barochart-compose:assembleRelease

      - name: Check 16 KiB load alignment of both ABIs
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o native/android/library/build/outputs/aar/barochart-android-release.aar 'jni/*' -d "${RUNNER_TEMP}/aar"
          node scripts/check-elf-alignment.mjs "${RUNNER_TEMP}/aar/jni/arm64-v8a/libbarochart.so" "${RUNNER_TEMP}/aar/jni/x86_64/libbarochart.so"

      - name: Build Compose sample release with R8
        run: gradle --console=plain -p examples/compose-sample :app:assembleRelease

      - name: Build JS-only and Rust-only AARs and verify their load alignment
        shell: bash
        run: |
          set -euo pipefail
          gradle --console=plain -p native/android/library -PbarochartRust=false -PasterBuildDir="${RUNNER_TEMP}/android-js" assembleRelease
          gradle --console=plain -p native/android/library -PbarochartQuickjs=false -PasterBuildDir="${RUNNER_TEMP}/android-rust" assembleRelease
          for backend in js rust; do
            unzip -q -o "${RUNNER_TEMP}/android-${backend}/outputs/aar/barochart-android-release.aar" 'jni/*' -d "${RUNNER_TEMP}/aar-${backend}"
            node scripts/check-elf-alignment.mjs "${RUNNER_TEMP}/aar-${backend}/jni/arm64-v8a/libbarochart.so" "${RUNNER_TEMP}/aar-${backend}/jni/x86_64/libbarochart.so"
          done

  android-x86-smoke:
    # 이 저장소의 로컬 검증 Mac은 arm64라 x86_64 .so는 여기서만 실제로 실행된다
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pinned native Rust toolchain and locked dependency sources
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          cd ..
          node scripts/rust/cargo.mjs fetch --locked

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14.5'

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # yes를 파이프로 넘기면 sdkmanager가 끝난 뒤 yes가 SIGPIPE로 실패해 pipefail이 단계를 실패시킨다
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14033849" "cmake;3.22.1" < <(yes) > /dev/null

      - name: Run typed engine tests on an x86_64 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # Official release: https://github.com/ReactiveCircus/android-emulator-runner/releases/tag/v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle --console=plain -p native/android/library :connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=kr.coden.barochart.TypedEngineTest,kr.coden.barochart.RustRuntimeTest
            gradle --console=plain -p native/android/library :connectedDebugAndroidTest -PbarochartRust=false -PasterBuildDir="${RUNNER_TEMP}/test-js" -Pandroid.testInstrumentationRunnerArguments.class=kr.coden.barochart.RustRuntimeTest
            gradle --console=plain -p native/android/library :connectedDebugAndroidTest -PbarochartQuickjs=false -PasterBuildDir="${RUNNER_TEMP}/test-rust" -Pandroid.testInstrumentationRunnerArguments.class=kr.coden.barochart.RustRuntimeTest
